<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ثبت‌نام - فمینیسم دوستیابی</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .auth-container {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 24px 20px;
            background: linear-gradient(135deg, #5B197B 0%, #667eea 100%);
        }
        .top-links {
            margin-bottom: 18px;
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            justify-content: center;
        }
        .top-links a {
            color: #fff; text-decoration: none; background: rgba(255,255,255,0.16);
            padding: 8px 16px; border-radius: 999px; font-size: 14px; font-weight: 600;
        }
        .auth-box {
            background: var(--bg-card); border-radius: 20px; padding: 36px;
            max-width: 540px; width: 100%; box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }
        .auth-header { text-align: center; margin-bottom: 24px; }
        .auth-header i {
            font-size: 52px;
            background: linear-gradient(135deg, #FF6B6B 0%, #FF8E53 100%);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        }
        .auth-header h1 { color: var(--text-primary); margin: 10px 0 6px; font-size: 26px; }
        .auth-header p { color: var(--text-secondary); font-size: 14px; }
        .form-group { margin-bottom: 16px; }
        .form-group label { display: block; color: var(--text-primary); margin-bottom: 6px; font-weight: 600; font-size: 14px; }
        .form-group input, .form-group select {
            width: 100%; padding: 12px 14px; border: 2px solid var(--border);
            border-radius: 10px; font-size: 14px; background: var(--bg-input); color: var(--text-primary);
        }
        .btn-primary {
            width: 100%; padding: 14px;
            background: linear-gradient(135deg, #FF6B6B 0%, #FF8E53 100%);
            color: white; border: none; border-radius: 10px; font-size: 16px; font-weight: 700;
            cursor: pointer; transition: all 0.3s; margin-top: 8px;
        }
        .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 10px 25px rgba(255, 107, 107, 0.35); }
        .auth-footer { text-align: center; margin-top: 18px; color: var(--text-secondary); }
        .auth-footer a { color: var(--primary); text-decoration: none; font-weight: 600; }
        .error-message { background: rgba(244, 67, 54, 0.12); color: #e53935; padding: 12px; border-radius: 8px; margin-bottom: 16px; display: none; }
        .success-message { background: rgba(76, 175, 80, 0.12); color: #2e7d32; padding: 12px; border-radius: 8px; margin-bottom: 16px; display: none; }
        .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
        @media (max-width: 600px) { .form-row { grid-template-columns: 1fr; } }
    </style>
</head>
<body>
    <div class="auth-container">
        <div class="top-links">
            <a href="index.html"><i class="fas fa-home"></i> صفحه اصلی</a>
            <a href="app.html"><i class="fas fa-robot"></i> وب‌اپ هوش مصنوعی</a>
            <a href="safety.html"><i class="fas fa-shield-alt"></i> ۱۳ ابزار ایمنی</a>
        </div>

        <div class="auth-box">
            <div class="auth-header">
                <i class="fas fa-user-plus"></i>
                <h1>ثبت‌نام امن و رایگان</h1>
                <p>به جامعه امن و توانمند فمینیسم دوستیابی بپیوندید</p>
            </div>

            <div class="error-message" id="error-message"></div>
            <div class="success-message" id="success-message"></div>

            <form id="register-form">
                <div class="form-row">
                    <div class="form-group">
                        <label for="first-name">نام</label>
                        <input type="text" id="first-name" required placeholder="نام شما">
                    </div>
                    <div class="form-group">
                        <label for="last-name">نام خانوادگی (یا مستعار)</label>
                        <input type="text" id="last-name" required placeholder="نام خانوادگی">
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="username">نام کاربری</label>
                        <input type="text" id="username" required placeholder="نام کاربری انگلیسی">
                    </div>
                    <div class="form-group">
                        <label for="email">ایمیل</label>
                        <input type="email" id="email" required placeholder="you@example.com">
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="password">رمز عبور</label>
                        <input type="password" id="password" required placeholder="حداقل ۶ کاراکتر">
                    </div>
                    <div class="form-group">
                        <label for="confirm-password">تکرار رمز عبور</label>
                        <input type="password" id="confirm-password" required placeholder="تکرار رمز عبور">
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="age">سن</label>
                        <input type="number" id="age" required min="18" max="100" placeholder="مثلاً ۲۶">
                    </div>
                    <div class="form-group">
                        <label for="gender">جنسیت</label>
                        <select id="gender" required>
                            <option value="female">زن</option>
                            <option value="male">مرد</option>
                            <option value="other">سایر / کوییر</option>
                        </select>
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="city">شهر</label>
                        <input type="text" id="city" required placeholder="تهران، استانبول، برلین...">
                    </div>
                    <div class="form-group">
                        <label for="relationship-mode">حالت رابطه مورد نظر</label>
                        <select id="relationship-mode">
                            <option value="serious">💍 رابطه جدی</option>
                            <option value="startup">🚀 شریک استارتاپی (جدید)</option>
                            <option value="abroad">🌍 آشنایی بین‌المللی (جدید)</option>
                            <option value="emotional">💝 اتصال عاطفی عمیق</option>
                            <option value="intellectual">🧠 اتصال فکری و فرهنگی</option>
                            <option value="marriage">💒 ازدواج</option>
                            <option value="casual">🌸 رابطه دوستانه</option>
                            <option value="friendship">👥 دوستی خالص</option>
                            <option value="open">🌈 رابطه باز اخلاقی</option>
                        </select>
                    </div>
                </div>

                <button type="submit" class="btn-primary" id="reg-btn">
                    <i class="fas fa-user-plus"></i> ایجاد حساب و ورود به داشبورد
                </button>
            </form>

            <div class="auth-footer">
                <p>حساب کاربری دارید؟ <a href="login.html">وارد شوید</a></p>
            </div>
        </div>
    </div>

    <script src="js/auth.js"></script>
    <script>
        document.getElementById('register-form').addEventListener('submit', async function(e) {
            e.preventDefault();
            const firstName = document.getElementById('first-name').value.trim();
            const lastName = document.getElementById('last-name').value.trim();
            const email = document.getElementById('email').value.trim();
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirm-password').value;
            const age = parseInt(document.getElementById('age').value, 10);
            const gender = document.getElementById('gender').value;
            const city = document.getElementById('city').value.trim();
            const relationship_mode = document.getElementById('relationship-mode').value;

            if (password !== confirmPassword) {
                return showError('رمز عبور و تکرار آن مطابقت ندارند');
            }
            if (password.length < 6) {
                return showError('رمز عبور باید حداقل ۶ کاراکتر باشد');
            }
            if (isNaN(age) || age < 18) {
                return showError('سن شما باید حداقل ۱۸ سال باشد');
            }

            const btn = document.getElementById('reg-btn');
            btn.disabled = true;
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> در حال ثبت‌نام...';

            const result = await window.authService.registerAsync({
                firstName, lastName, email, username, password, age, gender, city, relationship_mode
            });

            if (result.success) {
                showSuccess('ثبت‌نام با موفقیت انجام شد! در حال ورود به داشبورد...');
                setTimeout(() => { window.location.href = 'dashboard.html'; }, 1000);
            } else {
                btn.disabled = false;
                btn.innerHTML = '<i class="fas fa-user-plus"></i> ایجاد حساب و ورود به داشبورد';
                showError(result.message);
            }
        });

        function showError(msg) {
            const el = document.getElementById('error-message');
            el.textContent = msg;
            el.style.display = 'block';
            document.getElementById('success-message').style.display = 'none';
        }
        function showSuccess(msg) {
            const el = document.getElementById('success-message');
            el.textContent = msg;
            el.style.display = 'block';
            document.getElementById('error-message').style.display = 'none';
        }
    </script>
</body>
</html>
